<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Castl-it-POS — Le point de vente et la gestion de stock pour votre commerce">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1330"/>
      <stop offset="1" stop-color="#161C3C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4064E8"/>
      <stop offset="1" stop-color="#2841A2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#3157D5" stop-opacity=".38"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#ground)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="8" fill="#3157D5"/>

  <!-- brand mark -->
  <g transform="translate(80,92)">
    <rect width="120" height="120" rx="32" fill="url(#mark)"/>
    <path d="M86 42 A25 25 0 1 0 86 78" fill="none" stroke="#ffffff" stroke-width="13.5" stroke-linecap="round"/>
    <circle cx="90" cy="60" r="8.5" fill="#F59E0B"/>
  </g>

  <!-- wordmark -->
  <text x="232" y="168" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-2">
    <tspan fill="#FFFFFF">Castl-it-</tspan><tspan fill="#8BA6FF">POS</tspan>
  </text>

  <!-- tagline -->
  <text x="234" y="238" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="27" font-weight="500" fill="#BECAEB">Vendez plus vite. Gérez votre stock. Sans effort.</text>

  <!-- headline -->
  <text x="80" y="360" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.6" fill="#FFFFFF">Votre caisse. Votre stock.</text>
  <text x="80" y="428" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-1.6" fill="#F59E0B">En ligne &amp; hors-ligne.</text>

  <!-- feature chips -->
  <g font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="600" fill="#DCE3F5">
    <g transform="translate(80,500)">
      <rect width="228" height="52" rx="26" fill="#202850"/>
      <text x="30" y="34">Caisse tactile</text>
    </g>
    <g transform="translate(324,500)">
      <rect width="266" height="52" rx="26" fill="#202850"/>
      <text x="30" y="34">Gestion de stock</text>
    </g>
    <g transform="translate(606,500)">
      <rect width="196" height="52" rx="26" fill="#202850"/>
      <text x="30" y="34">Hors-ligne</text>
    </g>
    <g transform="translate(818,500)">
      <rect width="214" height="52" rx="26" fill="#202850"/>
      <text x="30" y="34">FR · AR · EN</text>
    </g>
  </g>

  <!-- domain -->
  <text x="80" y="600" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="24" font-weight="700" fill="#F59E0B">castlitpos.com</text>
</svg>
