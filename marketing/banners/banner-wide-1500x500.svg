<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-label="Castl-it-POS">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1330"/>
      <stop offset="1" stop-color="#161C3C"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4064E8"/>
      <stop offset="1" stop-color="#2841A2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#3157D5" stop-opacity=".35"/>
      <stop offset="1" stop-color="#3157D5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 H0 V44" fill="none" stroke="#ffffff" stroke-opacity=".04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1500" height="500" fill="url(#ground)"/>
  <rect width="1500" height="500" fill="url(#grid)"/>
  <rect width="1500" height="500" fill="url(#glow)"/>

  <!-- centered lockup -->
  <g transform="translate(486,150)">
    <rect width="128" height="128" rx="36" fill="url(#mark)"/>
    <path d="M92 45 A26.5 26.5 0 1 0 92 83" fill="none" stroke="#ffffff" stroke-width="14.5" stroke-linecap="round"/>
    <circle cx="96.5" cy="64" r="9" fill="#F59E0B"/>
  </g>
  <text x="638" y="240" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="-2.2">
    <tspan fill="#FFFFFF">Castl-it-</tspan><tspan fill="#8BA6FF">POS</tspan>
  </text>

  <text x="750" y="330" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="28" font-weight="500" fill="#BECAEB">Le point de vente et la gestion de stock pour votre commerce</text>
  <text x="750" y="392" text-anchor="middle" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#F59E0B">castlitpos.com</text>
</svg>
