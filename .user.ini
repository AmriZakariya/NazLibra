; ── Castl-it-POS — OPcache freshness ────────────────────────────────────────
; This shared host runs OPcache with validate_timestamps=0, so PHP keeps serving
; the OLD compiled bytecode after a git pull / client update — which is why the
; admin buttons ran stale code and "Restart PHP" was needed every time.
; Re-enable timestamp checks so freshly deployed files are picked up on the next
; request, with no manual restart. The wildcard dispatcher (htdocs/index.php) is
; the entry script for the master AND every client, so this one file governs all.
opcache.validate_timestamps=1
opcache.revalidate_freq=0
